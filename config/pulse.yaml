# Pulse CLI Configuration
# AI-powered Indonesian Stock Market Analysis

app_name: "Pulse CLI"
version: "0.1.0"
debug: false

# AI Configuration (Official Google Gemini API)
ai:
  base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
  api_key: ""
  default_model: "gemini-2.0-flash"
  temperature: 0.7
  max_tokens: 4096
  timeout: 120
  
  available_models:
    gemini-2.0-flash: "Gemini 2.0 Flash (Fast)"
    gemini-1.5-flash: "Gemini 1.5 Flash"
    gemini-1.5-pro: "Gemini 1.5 Pro (Advanced)"

# Stockbit Configuration
stockbit:
  api_base_url: "https://exodus.stockbit.com"
  headless: true

# Data Configuration
data:
  cache_ttl: 3600  # 1 hour
  yfinance_suffix: ".JK"
  default_period: "3mo"

# Analysis Configuration
analysis:
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  
  sma_periods: [20, 50, 200]
  ema_periods: [9, 21, 55]
  
  bb_period: 20
  bb_std: 2.0
  
  volume_sma_period: 20
  volume_spike_threshold: 2.0

# UI Configuration
ui:
  theme: "dark"
  show_welcome: true
  history_size: 100
  max_results: 50
  chart_width: 60
  chart_height: 15